name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.10.3.
        required: true
        type: string

permissions:
  contents: read

env:
  FACTORIO_HEADLESS_VERSION: 2.0.76
  FACTORIO_DIR: ${{ github.workspace }}/.factorio-ci/factorio
  FACTORIO_MODS_DIR: ${{ github.workspace }}/.factorio-ci/mods
  PYTHON: python3
  LUAC: luac5.2
  STYLUA_VERSION: 2.5.2
  STYLUA_SHA256: bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab

jobs:
  build-test-attach:
    name: Build, Test, And Attach Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      mod_name: ${{ steps.metadata.outputs.mod_name }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      FACTORIO_SERVICE_USERNAME: ${{ secrets.FACTORIO_SERVICE_USERNAME }}
      FACTORIO_SERVICE_TOKEN: ${{ secrets.FACTORIO_SERVICE_TOKEN }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${RELEASE_TAG}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check lua5.2

          stylua_dir="${RUNNER_TEMP}/stylua"
          stylua_archive="${RUNNER_TEMP}/stylua.zip"
          mkdir -p "${stylua_dir}"
          curl -fsSL \
            -o "${stylua_archive}" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          echo "${STYLUA_SHA256}  ${stylua_archive}" | sha256sum -c -
          python3 -m zipfile -e "${stylua_archive}" "${stylua_dir}"
          chmod +x "${stylua_dir}/stylua"
          echo "${stylua_dir}" >> "${GITHUB_PATH}"

      - name: Run strict Lua tooling
        env:
          REQUIRE_LUA_TOOLS: "1"
        run: scripts/lint-lua.sh

      - name: Read release metadata
        id: metadata
        run: |
          mod_name="$(python3 -c 'import json; print(json.load(open("info.json"))["name"])')"
          version="$(python3 -c 'import json; print(json.load(open("info.json"))["version"])')"
          expected_tag="v${version}"
          if [ "${expected_tag}" != "${{ steps.release.outputs.tag }}" ]; then
            echo "Release tag ${{ steps.release.outputs.tag }} does not match info.json version ${version}." >&2
            exit 1
          fi
          echo "mod_name=${mod_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify generated public assets
        run: scripts/generate-public-assets.py --check

      - name: Generate release notes
        run: |
          scripts/generate-public-assets.py \
            --release-notes "dist/release-notes.md" \
            --portal-description "dist/mod-portal-description.md" \
            --portal-metadata "dist/mod-portal-metadata.env"

      - name: Require Mod Portal download credentials
        run: |
          if [ -z "${FACTORIO_SERVICE_USERNAME}" ] || [ -z "${FACTORIO_SERVICE_TOKEN}" ]; then
            echo "Missing FACTORIO_SERVICE_USERNAME and/or FACTORIO_SERVICE_TOKEN secrets for Mod Portal dependency downloads." >&2
            exit 1
          fi

      - name: Restore Factorio headless cache
        id: cache-factorio
        uses: actions/cache@v5
        with:
          path: ${{ env.FACTORIO_DIR }}
          key: ${{ runner.os }}-factorio-headless-${{ env.FACTORIO_HEADLESS_VERSION }}

      - name: Download Factorio headless
        if: steps.cache-factorio.outputs.cache-hit != 'true'
        run: |
          factorio_archive="${RUNNER_TEMP}/factorio-headless.tar.xz"
          rm -rf "${FACTORIO_DIR}"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "${factorio_archive}" \
            "https://www.factorio.com/get-download/${FACTORIO_HEADLESS_VERSION}/headless/linux64"
          mkdir -p "${FACTORIO_DIR}"
          tar -xJf "${factorio_archive}" -C "${FACTORIO_DIR}" --strip-components=1

      - name: Verify Factorio headless
        run: |
          "${FACTORIO_DIR}/bin/x64/factorio" --version

      - name: Restore Mod Portal dependency cache
        id: cache-mod-deps
        uses: actions/cache@v5
        with:
          path: ${{ env.FACTORIO_MODS_DIR }}
          key: ${{ runner.os }}-factorio-mod-deps-${{ hashFiles('info.json', 'scripts/download-mod-dependencies.py') }}

      - name: Download required Mod Portal dependencies
        run: scripts/download-mod-dependencies.py --mods-dir "${FACTORIO_MODS_DIR}"

      - name: Run headless suite
        env:
          FACTORIO_BIN: ${{ env.FACTORIO_DIR }}/bin/x64/factorio
        run: scripts/test-headless.sh

      - name: Build release package
        id: package
        run: |
          package_path="$(scripts/package.sh | tail -n 1)"
          test -f "${package_path}"
          echo "package_path=${package_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: turret-xp-${{ steps.release.outputs.tag }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

      - name: Upload release public assets
        uses: actions/upload-artifact@v7
        with:
          name: turret-xp-public-assets-${{ steps.release.outputs.tag }}
          path: |
            dist/release-notes.md
            dist/mod-portal-description.md
            dist/mod-portal-metadata.env
          if-no-files-found: error

      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.release.outputs.tag }}" --notes-file "dist/release-notes.md"

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.package.outputs.package_path }}" --clobber

  publish-mod-portal:
    name: Publish Mod Portal Release
    runs-on: ubuntu-latest
    needs: build-test-attach
    environment:
      name: factorio-mod-portal
      url: https://mods.factorio.com/mod/turret_xp
    env:
      FACTORIO_MOD_PORTAL_API_KEY: ${{ secrets.FACTORIO_MOD_PORTAL_API_KEY }}

    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Require Mod Portal publish key
        run: |
          if [ -z "${FACTORIO_MOD_PORTAL_API_KEY}" ]; then
            echo "Missing FACTORIO_MOD_PORTAL_API_KEY secret for Mod Portal publishing." >&2
            exit 1
          fi

      - name: Download GitHub Release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release-package
          gh release download "${{ needs.build-test-attach.outputs.tag }}" --pattern "turret_xp_*.zip" --dir dist/release-package

      - name: Download generated public assets
        uses: actions/download-artifact@v7
        with:
          name: turret-xp-public-assets-${{ needs.build-test-attach.outputs.tag }}
          path: dist/release-public-assets

      - name: Publish to Factorio Mod Portal
        env:
          RELEASE_TAG: ${{ needs.build-test-attach.outputs.tag }}
          MOD_NAME: ${{ needs.build-test-attach.outputs.mod_name }}
          MOD_VERSION: ${{ needs.build-test-attach.outputs.version }}
        run: |
          package_count="$(find dist/release-package -maxdepth 1 -type f -name 'turret_xp_*.zip' | wc -l)"
          if [ "$package_count" -ne 1 ]; then
            echo "Expected exactly one GitHub Release package, found ${package_count}." >&2
            find dist/release-package -maxdepth 1 -type f >&2
            exit 1
          fi
          package_path="$(find dist/release-package -maxdepth 1 -type f -name 'turret_xp_*.zip' | head -n 1)"
          scripts/publish-mod-portal-release.sh \
            "$package_path" \
            "dist/release-public-assets/mod-portal-description.md" \
            "dist/release-public-assets/mod-portal-metadata.env"
