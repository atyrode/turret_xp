[mod-setting-description]
turret-xp-xp-per-damage=XP awarded per point of final damage dealt by gun turrets. Defaults low because damage totals grow quickly.
turret-xp-xp-per-kill-credit=XP awarded for one full kill credit. Shared proportionally across gun turrets based on damage contribution.
turret-xp-level-base-xp=XP required to advance from level 0 to level 1 before growth is applied.
turret-xp-level-growth=Linear growth step applied to each next level's XP requirement. At the default 1.65 value, each level adds 65% of the base XP to the next requirement.
turret-xp-travelling-asteroid-xp-multiplier=XP multiplier for asteroid and asteroid-chunk damage and kill credit while the platform is travelling between space locations. Applies when XP is earned and does not stack with the platform non-asteroid multiplier.
turret-xp-stopped-asteroid-xp-multiplier=XP multiplier for asteroid and asteroid-chunk damage and kill credit while the platform is stopped, paused, or otherwise not advancing between space locations. Lower by default because stationary asteroid trickle is repeatable and low risk. Applies when XP is earned.
